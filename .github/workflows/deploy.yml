name: Build and Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: propertyark-backend
  ECR_REGISTRY: 933313868570.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Build Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933313868570:role/GitHubActionsECRBuildRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "Image tag $IMAGE_TAG already exists in ECR."
            echo "Reusing the existing image."

          else
            echo "Building image with tag $IMAGE_TAG..."

            docker build \
              -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              .

            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      - name: Configure AWS credentials (Deploy Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933313868570:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "ERROR: EC2_INSTANCE_ID GitHub secret is missing."
            exit 1
          fi

          echo "Starting deployment of image: $IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PropertyArk backend $IMAGE_TAG" \
            --parameters "commands=[
              \"cd /home/ubuntu && export AWS_REGION='$AWS_REGION' ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' && sudo -E /home/ubuntu/deploy.sh\"
            ]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for SSM to finish. Do not hide deployment failures.
          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"; then
            echo "SSM command did not complete successfully."
          fi

          echo "----- SSM INVOCATION STATUS -----"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text || true

          echo "----- STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: PropertyArk backend deployment failed."
            exit 1
          fi

          echo "PropertyArk backend deployed successfully."